source /boot/grub/config.cfg

# ODEN. @-markörerna fylls i av live-build (kärna, initrd och bootappend ur auto/config).
menuentry "Starta ODEN" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# Enkel grafik och en processor: för datorer där vanlig start hänger sig (t.ex. äldre NVIDIA-kort).
menuentry "Starta ODEN (säkert läge)" --hotkey=a {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset noapic nosmp
	initrd	@INITRD_LIVE@
}

submenu 'Verktyg...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI-inställningar" --hotkey=f {
			fwsetup
		}
	fi

	# Kontrollera skivans checksummor
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Kontrollera stickans integritet" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
