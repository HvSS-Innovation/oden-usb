set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Högre upplösning än live-builds 800x600 (MacBook-skärmar blir annars små); auto väljer det firmwaren erbjuder.
if loadfont $font ; then
    set gfxmode=1440x900,1920x1080,1280x800,1024x768,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
