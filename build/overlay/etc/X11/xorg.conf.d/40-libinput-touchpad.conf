# Pekplatta, inställd för Mac-vana: rulla med två fingrar (naturlig riktning), tryck med två fingrar = högerklick,
# tre = mittenklick, knacka = klick, dra med knackning. Gäller alla pekplattor (libinput).
# Vill du ha vanlig rullriktning: sätt NaturalScrolling till "off".
Section "InputClass"
    Identifier "ODEN touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "TappingButtonMap" "lrm"
    Option "ClickMethod" "clickfinger"
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "on"
    Option "DisableWhileTyping" "on"
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.3"
EndSection
