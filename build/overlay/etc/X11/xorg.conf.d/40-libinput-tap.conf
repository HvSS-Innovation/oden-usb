# Knacka på pekplattan = klick, och naturlig rullning av. Utan detta går pekplattor ofta inte att klicka utan fysisk knapp.
Section "InputClass"
    Identifier "ODEN touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "DisableWhileTyping" "on"
EndSection
