# Var varje artefakt i artifacts.lock kommer ifrån. Används av scripts/bump.sh.
# namn  github-repo  tagg-mall ({v} = version)  asset-regex ('-' = git-taggens källtarball)
oden-source        NicklasAndersson/oden               v{v}    -
oden-valv          larsnor/ODEN-analys                 v{v}    ^ODEN-valv-.*\.zip$
signal-cli         AsamK/signal-cli                    v{v}    ^signal-cli-[0-9.]+\.tar\.gz$
jre-x64            adoptium/temurin25-binaries         jdk-{v} jre_x64_linux_hotspot.*\.tar\.gz$
obsidian-appimage  obsidianmd/obsidian-releases       v{v}    ^Obsidian-[0-9.]+\.AppImage$
go-pmtiles         protomaps/go-pmtiles                v{v}    ^go-pmtiles_.*_Linux_x86_64\.tar\.gz$
ollama             ollama/ollama                       v{v}    ^ollama-linux-amd64\.tar\.zst$
